<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>

    <h1>Contact Me</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject"><br><br>

        <label for="message">Message:</label><br>
        <textarea name="message" id="message" rows="5" cols="40"></textarea><br><br>

        <button type="submit">Send Message</button><br><br>

        <iframe src="https://youtu.be/cpoXLj24BDY?si=uQFkoWyuRbRUkbE_" title="YouTube video player" frameborder="1"></iframe>
        
    </form>

</body>
</html>
