<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1"> <!-- Table tag is used to create a table in HTML. The 'border' attribute specifies the width of the border around the table. -->
        <tr> <!-- Table row tag is used to define a row in the table. Each row can contain multiple table cells. -->
            <th>Name</th> <!--table header cell mean in this we define the column headers -->
            <th>Age</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>Rahul</td> <!--table data cell in this we define the data for each cell in the row -->
            <td>25</td>
            <td>rahul@example.com</td>
        </tr>
        <tr>
            <td>John</td>
            <td>30</td>
            <td>john@example.com</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>28</td>
            <td>jane@example.com</td>
        </tr>
        <tr>
            <td>Mohan</td>
            <td>35</td>
            <td>mohan@example.com</td>
        </tr>
    </table>

    <br>

    <table border="1">
        <caption>Employee Information</caption> <!-- The <caption> tag defines a title or description for the table -->
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Salary</th>
        </tr>
        <tr>
            <td>001</td>
            <td>John Doe</td>
            <td>IT</td>
            <td>$50,000</td>
        </tr>
        <tr>
            <td>002</td>
            <td>Jane Smith</td>
            <td>HR</td>
            <td>$60,000</td>
        </tr>
        <tr>
            <td>003</td>
            <td>Mike Johnson</td>
            <td>Finance</td>
            <td>$55,000</td>
        </tr>
        <tr>
            <td colspan="4">Total Employees: 3</td> <!-- The 'colspan' attribute is used to merge multiple columns into a single cell. In this case, it merges 4 columns to display the total number of employees. -->
        </tr>
    </table>
</body>
</html>
